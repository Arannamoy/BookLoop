{% load static %}
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">

<div class="w-[90%] mx-auto py-8">
  <div id="carousel" class="relative overflow-hidden rounded-lg">
    <!-- Slides wrapper -->
    <div class="relative w-full h-64 md:h-96">
      <!-- Slide 1 -->
       
       {% for book in books %}
       <div class="carousel-slide absolute inset-0 transition-transform duration-700 ease-in-out transform translate-x-0 bg-primary">
        <div class="flex justify-between lg:flex-row flex-col items-center">
            <div class="w-[50%] flex justify-center items-center">
            <img src="{{ book.book_image.url }}" alt="Slide 1" class="w-[250px] h-[250px] m-auto ">
            </div>
            <div class="w-[50%] flex justify-center items-center">
                <div class="w-[100%]">
                 <h3 class="text-2xl font-bold text-black ">{{book.title}}</h3>
                 <h3 class="text-2xl font-bold text-black ">Author: {{book.author}}</h3>
                 <p class="mt-2 text-sm text-black">Handpicked books for you.</p>
                 <h1>total_borrowed_time: {{  book.total_borrowed_time }}</h1>
                </div>
            </div>
        </div>
        
        
      </div>
       {% endfor %}
      
    </div>

    <!-- Controls -->
    <button id="prevBtn" class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white p-2 rounded-full shadow">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button id="nextBtn" class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white p-2 rounded-full shadow">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </button>

    <!-- Indicators -->
    <div id="indicators" class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">
      <button class="indicator w-3 h-3 rounded-full bg-white/80 ring-2 ring-white/60"></button>
      <button class="indicator w-3 h-3 rounded-full bg-white/40 hover:bg-white/80"></button>
      <button class="indicator w-3 h-3 rounded-full bg-white/40 hover:bg-white/80"></button>
    </div>
  </div>
</div>

<script>
(function(){
  const carousel = document.getElementById('carousel');
  const slides = Array.from(carousel.querySelectorAll('.carousel-slide'));
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const indicators = Array.from(document.querySelectorAll('#indicators .indicator'));

  let current = 0;
  let autoplay = true;
  const AUTOPLAY_DELAY = 1000;
  let timer = null;

  function goTo(index) {
    index = (index + slides.length) % slides.length;
    slides.forEach((s, i) => {
      s.classList.remove('translate-x-0','translate-x-full','-translate-x-full');
      if (i === index) s.classList.add('translate-x-0');
      else if (i < index) s.classList.add('-translate-x-full');
      else s.classList.add('translate-x-full');
    });
    indicators.forEach((dot, i) => {
      if (i === index) {
        dot.classList.remove('bg-white/40');
        dot.classList.add('bg-white/80');
      } else {
        dot.classList.remove('bg-white/80');
        dot.classList.add('bg-white/40');
      }
    });
    current = index;
  }

  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  // attach controls
  nextBtn.addEventListener('click', () => { next(); resetTimer(); });
  prevBtn.addEventListener('click', () => { prev(); resetTimer(); });

  // indicators click
  indicators.forEach((dot, i) => {
    dot.addEventListener('click', () => { goTo(i); resetTimer(); });
  });

  // autoplay
  function startTimer() {
    if (autoplay) timer = setInterval(next, AUTOPLAY_DELAY);
  }
  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }
  function resetTimer() {
    stopTimer();
    startTimer();
  }

  // pause on hover/focus
  carousel.addEventListener('mouseenter', () => { stopTimer(); });
  carousel.addEventListener('mouseleave', () => { startTimer(); });
  carousel.addEventListener('focusin', () => { stopTimer(); });
  carousel.addEventListener('focusout', () => { startTimer(); });

  // touch / swipe support
  let startX = 0, deltaX = 0;
  carousel.addEventListener('touchstart', (e) => {
    stopTimer();
    startX = e.touches[0].clientX;
    deltaX = 0;
  }, {passive: true});
  carousel.addEventListener('touchmove', (e) => {
    deltaX = e.touches[0].clientX - startX;
  }, {passive: true});
  carousel.addEventListener('touchend', () => {
    const threshold = 50;
    if (deltaX > threshold) prev();
    else if (deltaX < -threshold) next();
    resetTimer();
  });

  // init
  goTo(0);
  startTimer();

  // expose goTo in case you want control from outside
  window.carouselGoTo = goTo;
})();
</script>
