    </a>

  <!-- Center: Menu (Desktop) -->

    <!-- When logged in (replace above) -->
    <!-- <button class="btn btn-error text-white">Logout</button> -->

    <!-- Theme Toggle -->
    <label class="swap swap-rotate">
      <!-- this hidden checkbox controls the state -->
      <input type="checkbox" class="theme-controller" value="dark" />

      <!-- sun icon -->
      <svg class="swap-off fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 24 24">
        <path d="M5.64 17.66A9 9 0 1 1 18.36 6.34 9 9 0 0 1 5.64 17.66zM12 4V2m0 20v-2m8-8h2M2 12h2m15.07 7.07 1.41 1.41M4.93 4.93 3.52 3.52m12.73 0 1.41 1.41M4.93 19.07l-1.41 1.41" />
      </svg>

      <!-- moon icon -->
      <svg class="swap-on fill-current w-6 h-6" xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 0 1 11.21 3 7 7 0 1 0 21 12.79z" />
      </svg>
    </label>
  </div>

  <!-- Mobile Dropdown -->
  <div class="dropdown lg:hidden navbar-end">

    <ul tabindex="0"

      <li><a href="/browse">Browse Books</a></li>

      <li><a href="/signup">Sign Up</a></li>
      <li><a href="/login">Login</a></li>
      <!-- <li><a href="/logout" class="text-error">Logout</a></li> -->
      <li class="mt-2">
        <!-- Theme Toggle inside dropdown -->
        <label class="swap swap-rotate">
          <input type="checkbox" class="theme-controller" value="dark" />
          <svg class="swap-off fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 24 24">
            <path d="M5.64 17.66A9 9 0 1 1 18.36 6.34 9 9 0 0 1 5.64 17.66zM12 4V2m0 20v-2m8-8h2M2 12h2m15.07 7.07 1.41 1.41M4.93 4.93 3.52 3.52m12.73 0 1.41 1.41M4.93 19.07l-1.41 1.41" />

            <path d="M21 12.79A9 9 0 0 1 11.21 3 7 7 0 1 0 21 12.79z" />
