{% extends "base.html" %}
{% block content %}
<div class="flex justify-center  w-[100%]">
   <div>
       <table class="table table-pin-rows w-[100%]">
   <thead>
     <tr class="text-[1.5rem] text-black">
       <th>Borrow Id</th>
       <th>Book</th>
       <th>borrow_date</th>
       <th>return_date</th>
     </tr>
   </thead>
   <tbody>
   {% for r in b %}
   <tr>
       <td ><h1>{{r.id}}</h1></td>
       <td ><h1>{{r.book}}</h1></td>
       <td ><h1>{{r.borrow_date}}</h1></td>
       {% if r.return_date %}
       <td class="flex justify-center "> <h1 class="bg-lime-400 border border-solid border-lime-400 p-[15px] rounded-lg">{{r.return_date}}</h1></td>
       {%else %}
       <td class="flex justify-center "><h1 class="bg-rose-600 border border-solid border-rose-600 p-[15px] rounded-lg">{{r.return_date}}</h1></td>
       {%endif%}
   </tr>
   {% endfor %}
   </tbody>
   <tfoot>
     <tr class="text-[1.5rem] text-black">
       <th>Borrow Id</th>
       <th>Book</th>
       <th>borrow_date</th>
       <th>return_date</th>
     </tr>
   </tfoot>
 </table>
   </div>
</div>
{% endblock %}
