<div class="w-[90%] mx-auto py-[50px] ">
    <div class="collapse bg-base-100 border border-base-300 mx-auto">
        <input type="radio" name="my-accordion-1"  />
        <div class="collapse-title font-semibold">Filter</div>
        <div class="collapse-content">
            <div class="flex justify-between items-center">
                {% if categorys %}
                <select class="select select-primary my-[25px]">
                    <option class="text-[1rem] font-bold text-black" disabled selected>Select Category</option>
                    {% for category in categorys %}
                    <option class="text-[1rem] font-bold text-black"><a href="">{{category}}</a></option>
                    {% endfor %}
                </select>
                {% endif %}
                {% if books %}

                <select class="select select-primary my-[25px]">
                    <option class="text-[1rem] font-bold text-black" disabled selected>Order By</option>
                    <option class="text-[1rem] font-bold text-black"><a href="">Low To High( Borrow Price )</a></option>
                    <option class="text-[1rem] font-bold text-black"><a href="">High To Low( Borrow Price )</a></option>
                    <option class="text-[1rem] font-bold text-black"><a href="">Low To High( Total Time Borrowed )</a>
                    </option>
                    <option class="text-[1rem] font-bold text-black"><a href="">High To Low( Total Time Borrowed )</a>
                    </option>
                    <option class="text-[1rem] font-bold text-black"><a href="">Low To High( Rating )</a></option>
                    <option class="text-[1rem] font-bold text-black"><a href="">High To Low ( Rating )</a></option>
                </select>

                {% endif %}
            </div>
        </div>
    </div>

    <div class="my-[25px] flex justify-evenly">
        {% if books %}
        {% for book in books %}
        <div class="card bg-base-100 w-96 shadow-sm">
            <figure>
                <img src="{{ book.book_image.url}}" alt="Shoes" />
            </figure>
            <div class="card-body">
                <h2 class="card-title">{{book.book_name}}</h2>
                <p>{{book.author}}</p>
                <div class="card-actions justify-between flex">
                    <button class="btn btn-warning">
                        <a href="{% url 'specific_book' book.id %}">View More</a>
                    </button>
                    {% if book.quantity > 0 %}
                    <a class="btn btn-primary" href="{%url 'borrow_book' book.id%}">Borrow Now</a>
                    {%else%}
                    <button class="btn btn-error">Out of stock</button>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %} {% else %}
        <h1 class="text-center font-bold text-red-600 text-[2.5rem]">
            No Book Found
        </h1>
        {% endif %}
    </div>
</div>
