{% extends 'base.html' %}

{% block title %}
BookLoop | Home
{% endblock %}

{% block content %}
<div class="w-[80%] mx-auto flex py-[25px]">
  <div class="w-40%">
    <img
      src="{{ book.book_image.url }}"
      alt="Movie" class="w-[100%]"/>
  </div>
  <div class="card-body w-[60%]">
    <h2 class="card-title">{{book.book_name}}</h2>
    <h2 class="card-title">{{book.author}}</h2>
    <h2 class="card-title">$ {{book.borrow_price}}</h2>
    <p>{{book.description}}</p>
    <div class="card-actions justify-between">
        <h1 class="btn btn-warning">Stock left: {{book.quantity}}</h1>
      {% if book.quantity > 0 %}
        <button class="btn btn-primary">Borrow Now</button>
        {%else%}
        <button class="btn btn-error">Out of stock</button>
        {% endif %}
    </div>
</div>
</div>
{% endblock %}
